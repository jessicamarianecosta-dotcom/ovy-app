name: Build Ovy Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ovy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      # Publica também como Release, com um link estável e fixo pra baixar
      # direto do navegador do celular — sem precisar do Android Studio nem
      # de passar pelo ambiente do Claude.
      - name: Publish as GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest \
            app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "Ovy Android (debug)" \
            --notes "Build automático a partir do commit ${{ github.sha }}. Instale habilitando \"Instalar de fontes desconhecidas\" ao abrir o arquivo." \
            --target "${{ github.sha }}"
