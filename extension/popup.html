<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        color: #111b36;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12px;
        color: #6b7280;
        margin: 0 0 12px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 13px;
        margin-bottom: 8px;
      }
      button {
        width: 100%;
        padding: 9px;
        border: none;
        border-radius: 999px;
        background: #111b36;
        color: white;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover {
        background: #8b5cf6;
      }
      a {
        color: #8b5cf6;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
      }
      hr {
        border: none;
        border-top: 1px solid #e5e7eb;
        margin: 14px 0;
      }
      button.secondary {
        background: #8b5cf6;
      }
      button.secondary:hover {
        background: #7c3aed;
      }
      button.stop {
        background: #dc2626;
      }
      button.stop:hover {
        background: #b91c1c;
      }
    </style>
  </head>
  <body>
    <h1>Ovy — Legenda ao vivo</h1>
    <p>
      Cole sua chave de API (gere em
      <a href="https://ovy-app.vercel.app/configuracoes" target="_blank" rel="noreferrer">
        ovy-app.vercel.app/configuracoes
      </a>
      ).
    </p>
    <input id="apiKey" type="password" placeholder="ovy_..." />
    <button id="save">Salvar chave</button>
    <div id="status"></div>
    <hr />
    <p>
      O Chrome só libera a captura de áudio quando você clica aqui (ícone da
      extensão) — um clique no botão flutuante da página sozinho não é
      suficiente.
    </p>
    <button id="toggleCapture" class="secondary">Ativar legenda nesta aba</button>
    <div id="captureStatus"></div>
    <script src="popup.js"></script>
  </body>
</html>
